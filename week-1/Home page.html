<!DOCTYPE html>
<html>
<head>
    <title>Anurag University Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
        header {
            background-color: #800000;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }
        .container {
            display: flex;
            padding: 20px;
        }
        main {
            width: 70%;
            padding: 20px;
            background-image: url("anurag-logo.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 250px;
        }
        aside {
            width: 30%;
            background-color: #f2f2f2;
            padding: 20px;
        }
        footer {
            background-color: #800000;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Anurag University</h1>
        <p>Welcome to Anurag University</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <main>
            <h2>University</h2>
        </main>
        <aside>
            <h3>Announcements</h3>
        </aside>
    </div>
    <footer>
        <p>© 2026 Anurag University. All Rights Reserved.</p>
    </footer>
</body>
</html>
