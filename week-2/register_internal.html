<!DOCTYPE html>
<html>
<head>
<title>Salon Registration</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
}
form{
    width:350px;
    margin:auto;
    background:white;
    padding:20px;
    border:1px solid gray;
}
h2{
    text-align:center;
    background:black;
    color:white;
    padding:15px;
}
input,select{
    width:100%;
    padding:8px;
}
input[type=submit],input[type=reset]{
    width:auto;
    background:black;
    color:white;
    margin-top:10px;
}
</style>

</head>

<body>

<h2>Royal Men's Salon Registration</h2>

<form>

<label>Full Name</label><br>
<input type="text" required minlength="3"><br><br>

<label>Email</label><br>
<input type="email" required><br><br>

<label>Mobile</label><br>
<input type="tel" pattern="[0-9]{10}" required><br><br>

<label>Service</label><br>
<select required>
<option value="">Select</option>
<option>Hair Cut</option>
<option>Beard Trim</option>
<option>Hair Spa</option>
<option>Facial</option>
</select><br><br>

<input type="submit" value="Register">
<input type="reset" value="Clear">

</form>

</body>
</html>
