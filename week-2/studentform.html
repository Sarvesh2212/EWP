<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>

<h2 align="center">Student Registration Form</h2>

<form>

Name:
<input type="text" required><br><br>

Email:
<input type="email" required><br><br>

Password:
<input type="password" minlength="6" required><br><br>

Age:
<input type="number" min="18" max="30" required><br><br>

Gender:
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female<br><br>

Course:
<select required>
    <option value="">Select</option>
    <option>CSE</option>
    <option>ECE</option>
    <option>AIML</option>
</select><br><br>

Phone:
<input type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required><br><br>

Address:<br>
<textarea rows="3" cols="20"></textarea><br><br>

<input type="submit" value="Register">
<input type="reset" value="Reset">

</form>

</body>
</html>
